name: Publish audited release
on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: audited-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      AUDITED_REPOSITORY: Prasanna-K-123/demand-inventory
      AUDITED_BASELINE: 58ef90d49539bf46cf3789070cfd0ee1f21b7189
      RELEASE_TAG: v1.0.2
      RELEASE_TITLE: Demand & Inventory Decisions — v1.0.2
      RELEASE_NOTES: |
        Input-contract maintenance with the original frozen research preserved.

        - Rejects missing sales, invalid target windows, misaligned allocation/simulation inputs, and delivery delays that cannot arrive in the weekly event model.
        - All 19 public tests pass, including 80 complete valid-input simulations compared exactly with the preserved original implementation. Explorer checks cover all nine saved model/budget views.
        - Two clean original/revised runs each prepare the pinned public M5 ZIP and refit all four fixed quantile models. Model bytes, forecasts, frozen records and final analysis reproduce exactly. The receipt gives commands, versions, hashes and scope.
        - Preserves the original source and readable patch. Exact revision checks supplement the unchanged historical freeze; no forecast selection or empirical result was retuned.

        [Input contracts and verification](https://github.com/Prasanna-K-123/demand-inventory/blob/v1.0.2/docs/INPUT_CONTRACTS.md) · [Open the budget explorer](https://prasanna-k-123.github.io/demand-inventory/).

        Original releases and their tags remain unchanged. Operating effects are simulations, not observed retailer savings or deployment results.
    steps:
      - name: Verify the audited baseline and publish
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          baseline = os.environ["AUDITED_BASELINE"]
          tag = os.environ["RELEASE_TAG"]
          title = os.environ["RELEASE_TITLE"]
          notes = os.environ["RELEASE_NOTES"]
          api_root = "https://api.github.com/repos/" + repo
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "audited-research-release",
          }

          def api(path, payload=None, missing_ok=False):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(api_root + path, data=data, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if missing_ok and error.code == 404:
                      return None
                  raise RuntimeError(f"GitHub request failed: {path} (HTTP {error.code})") from None

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def tag_commit():
              ref = api("/git/ref/tags/" + tag, missing_ok=True)
              if ref is None:
                  return None
              obj = ref["object"]
              for _ in range(4):
                  if obj["type"] == "commit":
                      return obj["sha"]
                  require(obj["type"] == "tag", "Unexpected tag object type.")
                  obj = api("/git/tags/" + obj["sha"])["object"]
              raise RuntimeError("Tag indirection exceeds the verification limit.")

          require(os.environ["GITHUB_REF"] == "refs/heads/main", "Release must run from main.")
          require(repo == os.environ["AUDITED_REPOSITORY"], "Unexpected repository.")
          comparison = api("/compare/" + baseline + "..." + sha)
          require(comparison["status"] == "ahead", "Audited baseline must be an ancestor.")
          require(comparison["total_commits"] == 1, "Only one release-automation commit is allowed.")
          changes = comparison["files"]
          require(
              len(changes) == 1
              and changes[0]["filename"] == ".github/workflows/release.yml"
              and changes[0]["status"] == "modified",
              "Research files must match the audited baseline exactly.",
          )

          deadline = time.monotonic() + 600
          while True:
              runs = api("/actions/runs?head_sha=" + sha + "&per_page=100")["workflow_runs"]
              candidates = [
                  run for run in runs
                  if run["name"] == "Verify public research"
                  and run["head_sha"] == sha
                  and run["head_branch"] == "main"
                  and run["event"] == "push"
              ]
              latest = max(candidates, key=lambda run: run["id"]) if candidates else None
              if latest and latest["status"] == "completed":
                  require(latest["conclusion"] == "success", "Research CI did not pass.")
                  break
              require(time.monotonic() < deadline, "Timed out waiting for research CI.")
              time.sleep(10)

          require(api("/branches/main")["commit"]["sha"] == sha, "Main changed during verification.")
          existing_target = tag_commit()
          require(existing_target in (None, sha), "Existing tag points to a different commit; no retagging is allowed.")
          release = api("/releases/tags/" + tag, missing_ok=True)
          if release is None:
              release = api("/releases", {
                  "tag_name": tag,
                  "target_commitish": sha,
                  "name": title,
                  "body": notes,
                  "draft": False,
                  "prerelease": False,
                  "make_latest": "true",
              })

          require(not release["draft"] and not release["prerelease"], "Release is not a final publication.")
          require(release["tag_name"] == tag and release["name"] == title, "Release identity differs.")
          require(release["body"].replace("\r\n", "\n").strip() == notes.strip(), "Release notes differ.")
          require(tag_commit() == sha, "Published tag does not match the tested commit.")
          require(api("/releases/latest")["id"] == release["id"], "New release is not marked Latest.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Published [{tag}]({release['html_url']}) after successful research CI.\n\n")
              summary.write(f"Audited research baseline: `{baseline}`\n\n")
              summary.write(f"Tagged commit: `{sha}`\n\n")
              summary.write("Research files are unchanged; only the release workflow was added.\n")
          print(json.dumps({"url": release["html_url"], "tag": tag, "sha": sha, "research_ci": latest["html_url"]}))

          PY
