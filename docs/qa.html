<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive browser verification</title><style>body{margin:0;background:#e9edf3;color:#162238;font:16px system-ui}header{padding:12px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}select{padding:8px}main{padding:0 12px;overflow:auto}iframe{display:block;width:100%;height:1600px;border:1px solid #aab4c4;background:white}p{font-size:13px;margin:0}</style><header><h1>Responsive browser verification</h1><label>Explorer viewport <select id="width"><option value="100%">Desktop — available width</option><option value="375px">Mobile width — 375 pixels</option><option value="320px">Narrow width — 320 pixels</option></select></label><p>This uses a real iframe CSS viewport; it does not emulate a phone OS or touch input.</p></header><main><iframe id="preview" title="Research explorer" src="./index.html"></iframe></main><script>document.getElementById('width').addEventListener('change',e=>document.getElementById('preview').style.width=e.target.value);</script></html>
